<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title">
  <title id="title">Sprout — ilustrasi aplikasi habit tracker</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#15130F"/>
    </pattern>
    <pattern id="dots-blue" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#2453F0"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#F2EBDD"/>
  <circle cx="240" cy="190" r="190" fill="#F5C84B" stroke="#15130F" stroke-width="8"/>
  <circle cx="1030" cy="660" r="240" fill="#2453F0" stroke="#15130F" stroke-width="8"/>
  <circle cx="1030" cy="660" r="240" fill="url(#dots-blue)" opacity="0.25"/>
  <rect x="45" y="470" width="330" height="210" fill="url(#dots)" opacity="0.15"/>

  <g transform="translate(430 78)">
    <rect x="0" y="0" width="352" height="660" rx="54" fill="#15130F"/>
    <rect x="16" y="16" width="320" height="628" rx="40" fill="#FFFCF5" stroke="#15130F" stroke-width="5"/>
    <rect x="126" y="32" width="100" height="22" rx="11" fill="#15130F"/>

    <text x="44" y="110" font-family="Arial, sans-serif" font-size="17" fill="#585145">Selamat pagi,</text>
    <text x="44" y="146" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#15130F">Tumbuh hari ini</text>

    <circle cx="274" cy="124" r="34" fill="#F5C84B" stroke="#15130F" stroke-width="5"/>
    <path d="M274 96 V124 L294 138" stroke="#15130F" stroke-width="5" stroke-linecap="round" fill="none"/>

    <g transform="translate(44 184)">
      <rect x="0" y="0" width="264" height="152" fill="#2453F0" stroke="#15130F" stroke-width="6"/>
      <text x="20" y="32" font-family="Arial Black, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#FFFCF5">STREAK MINGGU INI</text>
      <g fill="#FFFCF5">
        <circle cx="28" cy="82" r="15"/><circle cx="62" cy="82" r="15"/><circle cx="96" cy="82" r="15"/>
        <circle cx="130" cy="82" r="15"/><circle cx="164" cy="82" r="15"/>
      </g>
      <g fill="#2453F0">
        <path d="M21 82 L26 88 L36 76" stroke="#2453F0" stroke-width="4" fill="none"/>
        <path d="M55 82 L60 88 L70 76" stroke="#2453F0" stroke-width="4" fill="none"/>
        <path d="M89 82 L94 88 L104 76" stroke="#2453F0" stroke-width="4" fill="none"/>
      </g>
      <circle cx="198" cy="82" r="15" fill="#F5C84B" stroke="#FFFCF5" stroke-width="4"/>
      <text x="198" y="87" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#15130F">5</text>
      <path d="M20 116 H244" stroke="#FFFCF5" stroke-width="3" opacity="0.35"/>
      <text x="20" y="140" font-family="Arial, sans-serif" font-size="13" fill="#FFFCF5">5 dari 7 hari · teruskan!</text>
    </g>

    <!-- plant card -->
    <g transform="translate(44 358)">
      <rect x="0" y="0" width="264" height="220" fill="#FFFCF5" stroke="#15130F" stroke-width="6"/>
      <text x="18" y="30" font-family="Arial Black, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#585145">KEBIASAAN HARI INI</text>
      <g transform="translate(96 72)">
        <rect x="0" y="78" width="72" height="56" rx="6" fill="#F5C84B" stroke="#15130F" stroke-width="5"/>
        <path d="M36 78 V36" stroke="#15130F" stroke-width="6" stroke-linecap="round"/>
        <path d="M36 58 C12 58 4 42 4 28 C24 28 36 40 36 58 Z" fill="#2453F0" stroke="#15130F" stroke-width="4"/>
        <path d="M36 46 C60 46 68 30 68 16 C48 16 36 28 36 46 Z" fill="#2453F0" stroke="#15130F" stroke-width="4"/>
        <circle cx="36" cy="24" r="8" fill="#F5C84B" stroke="#15130F" stroke-width="3"/>
      </g>
      <circle cx="54" cy="186" r="12" fill="#2453F0" stroke="#15130F" stroke-width="4"/>
      <path d="M48 186 L53 191 L62 180" stroke="#FFFCF5" stroke-width="4" fill="none"/>
      <text x="78" y="191" font-family="Arial, sans-serif" font-size="14" fill="#585145">Siram tanaman</text>
      <circle cx="222" cy="186" r="12" fill="#FFFCF5" stroke="#15130F" stroke-width="4"/>
      <text x="244" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#585145">2/3</text>
    </g>

    <g transform="translate(44 602)">
      <rect x="0" y="0" width="264" height="8" rx="4" fill="#E5DAC4"/>
      <rect x="0" y="0" width="176" height="8" rx="4" fill="#2453F0"/>
    </g>
  </g>

  <g transform="translate(104 420) rotate(-6)">
    <rect x="0" y="0" width="222" height="92" fill="#FFFCF5" stroke="#15130F" stroke-width="7"/>
    <path d="M0 16 H222" stroke="#2453F0" stroke-width="8"/>
    <text x="20" y="48" font-family="Arial Black, Arial, sans-serif" font-size="16" letter-spacing="1" fill="#15130F">7 DAY STREAK</text>
    <text x="20" y="73" font-family="Arial, sans-serif" font-size="16" fill="#585145">kebiasaan kecil, efek besar</text>
    <path d="M222 38 L252 28 L246 60 Z" fill="#F5C84B" stroke="#15130F" stroke-width="5"/>
  </g>

  <g transform="translate(828 148) rotate(7)">
    <circle cx="0" cy="0" r="68" fill="#F5C84B" stroke="#15130F" stroke-width="7"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" fill="#15130F">TODAY</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#15130F">+1</text>
    <path d="M0 30 L-10 44 L10 44 Z" fill="#15130F"/>
  </g>

  <g transform="translate(856 548) rotate(-4)">
    <rect x="0" y="0" width="214" height="72" fill="#2453F0" stroke="#15130F" stroke-width="7"/>
    <text x="107" y="44" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" letter-spacing="1" fill="#FFFCF5">GROW SLOWLY</text>
  </g>

  <g transform="translate(150 680)">
    <path d="M0 0 C28 -38 68 -38 92 0 C64 26 30 26 0 0 Z" fill="#2453F0" stroke="#15130F" stroke-width="6"/>
    <path d="M16 6 L40 -16 M34 12 L58 -10" stroke="#15130F" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
